<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with safe zone rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Inner Shield / Card shape -->
  <g filter="url(#shadow)">
    <rect x="76" y="96" width="360" height="320" rx="36" fill="#ffffff" fill-opacity="0.08" stroke="url(#gold)" stroke-width="6" />
    <!-- Top badge -->
    <circle cx="256" cy="180" r="54" fill="url(#gold)" />
    <!-- Letter Q for Quetzal / Crédito -->
    <text x="256" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#1e3a8a" text-anchor="middle">Q</text>
    <!-- Brand text -->
    <text x="256" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">TU CRÉDITO</text>
    <text x="256" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="3">COBROS MÓVIL</text>
    <!-- Checkmark accent bar -->
    <path d="M180 360 L235 385 L335 340" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
