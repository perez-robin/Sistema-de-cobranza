<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1c2433;--mut:#5d6b82;--line:#c9d1de;--blue:#3f6aa3;--yel:#e8b923;--red:#c0392b;--ok:#e6f4ea;--okc:#1e7a3c;--late:#fdecea;

:root[data-theme="dark"]{--bg:#12161d;--card:#1b212c;--ink:#e8ecf3;--mut:#9aa7bd;--line:#323c4d;--blue:#7ba3d9;--red:#ff7b6b;--ok:#17301f;--okc:#6fd18c;--late:#3a1f1d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:14px}

.modes{display:flex;gap:8px;width:100%}.modes button{flex:1;background:transparent;color:var(--blue);border:2px solid var(--blue);padding:10px}.modes button.on{background:var(--blue);color:#fff}

.leg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.lg{padding:2px 9px;border-radius:12px;font-size:12px;border:1px solid var(--line)}
.clw.v,.lg.v{background:#d7f2de;border-color:#1e7a3c}.clw.a,.lg.a{background:#fff1b8;border-color:#e8b923}.clw.r,.lg.r{background:#fbd0cb;border-color:#c0392b}.clw.c,.lg.c{background:#d4ecfb;border-color:#3f8fd0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .clw.v,:root:not([data-theme="light"]) .lg.v{background:#17301f}:root:not([data-theme="light"]) .clw.a,:root:not([data-theme="light"]) .lg.a{background:#3a3213}:root:not([data-theme="light"]) .clw.r,:root:not([data-theme="light"]) .lg.r{background:#3a1f1d}:root:not([data-theme="light"]) .clw.c,:root:not([data-theme="light"]) .lg.c{background:#12303f}}
:root[data-theme="dark"] .clw.v,:root[data-theme="dark"] .lg.v{background:#17301f}:root[data-theme="dark"] .clw.a,:root[data-theme="dark"] .lg.a{background:#3a3213}:root[data-theme="dark"] .clw.r,:root[data-theme="dark"] .lg.r{background:#3a1f1d}:root[data-theme="dark"] .clw.c,:root[data-theme="dark"] .lg.c{background:#12303f}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.grid input,.cob input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sum div{border-left:4px solid var(--blue);padding:4px 10px}
.sum b{display:block;font-size:22px}
.sum .saldo{border-color:var(--yel)}
.sum .mora{border-color:var(--red)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;font-size:14px}
th{background:var(--bg);color:var(--blue)}
td input{width:100%;border:0;background:transparent;padding:6px 2px}
td.d{font-weight:700;text-align:center;width:44px}
tr.paid{background:var(--ok)}
tr.late{background:var(--late)}
.mora-c{white-space:nowrap}
.mora-c.on{color:var(--red);font-weight:700}
.mora-c input{width:auto;vertical-align:middle}
.nota{color:var(--red);margin:12px 0 0;font-size:14px}

.nav{display:flex;gap:8px;flex-wrap:wrap}

.cl small{color:var(--mut)}
.fotos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:8px}
.ph img{width:100%;max-height:200px;object-fit:cover;border-radius:6px;margin-bottom:6px;border:1px solid var(--line)}
.ph button{width:100%}
.sv{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:90%}

#est .meta span{color:var(--mut)}

#est .tot div{border-left:4px solid var(--blue);padding:2px 10px}
#est .tot b{display:block;font-size:20px}
#est .acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#est td.r{text-align:right}
@media print{.bar,.noprint,button{display:none!important}body{background:#fff;color:#000}.card{border-color:#999}#est table{min-width:0}#est th,#est td{font-size:12px;padding:2px 4px}:root{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#999;--ok:#fff;--late:#fff}}
</style>

<body>
<div class="wrap">
<header>
<h1>Tu <span>Crédito</span> · Cobros diarios</h1>
<div class="bar noprint">
<select id="sel" aria-label="Cliente"></select>
<button id="nuevo">Nuevo cliente</button>
<button id="cierre" class="sec">Cierre de caja</button>
<button id="reporte" class="sec">Reporte del día</button>
<button id="resp" class="sec">Respaldo</button>
<button id="print" class="sec">Estado de cuenta</button>

</div>
<div class="modes noprint" id="modes"></div>
</header>
<div id="app"></div>
<div id="est"></div>
<div id="toast" role="status"></div>
</div>
<script>
var DIAS=23, MORA=5, GRACIA=3, KEY="tucredito_cobros_v1";
var clients=[], cur=null, cobrador="", delAsk=false, est=false, tt=null, home=true, modo="d", cierres=[], panel="", pendRest=null, undoAsk=null, saveAsk=null, pdb=null;
try{clients=JSON.parse(localStorage.getItem(KEY)||"[]");cobrador=localStorage.getItem(KEY+"_cob")||""}catch(e){clients=[]}
try{cierres=JSON.parse(localStorage.getItem(KEY+"_cierres")||"[]")}catch(e){cierres=[]}
var l0=lst();cur=l0.length?l0[0].id:null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(clients));localStorage.setItem(KEY+"_cob",cobrador);localStorage.setItem(KEY+"_cierres",JSON.stringify(cierres))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function q(n){return "Q"+(Number(n)||0).toLocaleString("es-GT",{minimumFractionDigits:2,maximumFractionDigits:2})}
function iso(d){var m=d.getMonth()+1,k=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(k<10?"0":"")+k}
function tp(c){return c&&c.tipo==="s"?"s":"d"}
function nd(c){return tp(c)==="s"?6:23}
function rmin(c){return tp(c)==="s"?5:13}
function compTxt(c){return "Yo, "+(c.nombre||"__________")+", con DPI "+(c.dpi||"__________")+", me comprometo a pagar la cantidad otorgada de "+q(c.cantidad)+", en "+nd(c)+" pagos "+(tp(c)==="s"?"semanales":"diarios")+" de "+q(c.cuota)+", más la mora que corresponda según la nota de este estado de cuenta."}
function lst(){return clients.filter(function(c){return tp(c)===modo})}
function ahora(){var d=new Date(),h=d.getHours(),m=d.getMinutes();return(h<10?"0":"")+h+":"+(m<10?"0":"")+m}
function fh(t){if(!t)return"";var p=t.split(":"),h=+p[0],x=h>=12?"p. m.":"a. m.";h=h%12||12;return h+":"+p[1]+" "+x}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function fmt(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function get(){return clients.find(function(c){return c.id===cur})}
function blank(t){var r=[];for(var i=0;i<(t==="s"?6:23);i++)r.push({f:"",h:"",m:"",firma:"",mp:false});
 return{id:"c"+Date.now(),tipo:t==="s"?"s":"d",nombre:"",dpi:"",lugar:"",tel:"",cantidad:"",cuota:"",inicio:iso(new Date()),dom:true,guardado:false,fotos:{},rows:r}}
function due(c){ // fechas programadas de cobro
 var out=[],d=parse(c.inicio||iso(new Date()));
 var N=nd(c),sem=tp(c)==="s";
 while(out.length<N){ if(sem){out.push(iso(d));d.setDate(d.getDate()+7);continue} if(!(c.dom&&d.getDay()===0))out.push(iso(d)); d.setDate(d.getDate()+1)}
 return out}
function calc(c){
 var dues=due(c),hoy=iso(new Date()),cuota=+c.cuota||0,ab=0,mora=0,moraPag=0,n=0;
 var st=c.rows.map(function(r,i){
  var m=+r.m||0; if(m>0){ab+=m;n++}
  var late=r.f&&m>0? diff(r.f,dues[i])>=GRACIA : (m<=0 && diff(hoy,dues[i])>=GRACIA);
  if(late){mora+=MORA; if(r.mp)moraPag+=MORA}
  return{due:dues[i],late:late,paid:m>0}});
 var total=cuota*nd(c);
 return{st:st,total:total,ab:ab,saldo:Math.max(total-ab,0),mora:mora,moraPend:mora-moraPag,n:n}}
function head(){
 var nD=clients.filter(function(c){return tp(c)==="d"}).length,nS=clients.length-nD;
 document.getElementById("modes").innerHTML='<button data-modo="d" class="'+(modo==="d"?"on":"")+'"> Cobros diarios ('+nD+')</button><button data-modo="s" class="'+(modo==="s"?"on":"")+'">️ Cobros semanales ('+nS+')</button>';
 document.getElementById("nuevo").textContent=modo==="s"?"Nuevo cliente semanal":"Nuevo cliente diario";
 var s=document.getElementById("sel");
 s.innerHTML=lst().length?lst().map(function(c){return'<option value="'+c.id+'"'+(c.id===cur?" selected":"")+'>'+({v:" ",c:" ",a:" ",r:" "}[semaf(c).cls]||"")+(renovDue(c)?" ":"")+esc(c.nombre||"Cliente sin nombre")+(c.cerrado?" (renovado)":"")+'</option>'}).join(""):'<option>Sin clientes</option>'}
function toast(m){var e=document.getElementById("toast");e.textContent=m;e.style.display="block";clearTimeout(tt);tt=setTimeout(function(){e.style.display="none"},3500)}
function render(){
 head();
 if(panel){var A=document.getElementById("app");document.getElementById("est").style.display="none";document.querySelector("header").style.display="";A.style.display="";A.innerHTML=panelHtml();return}
 var app=document.getElementById("app"),c=get(),E=document.getElementById("est"),on=est&&c;
 document.querySelector("header").style.display=on?"none":"";
 E.style.display=on?"block":"none";app.style.display=on?"none":"";
 if(on){renderEst(c,E);return}
 if(home&&c){app.innerHTML=homeHtml();return}
 if(!c){app.innerHTML='<div class="card empty">Aún no hay clientes en esta sección. Toque «Nuevo cliente» para abrir una tarjeta de cobro de '+(modo==="s"?"6 semanas":"23 días")+'.</div>';return}
 var k=calc(c),h=navHtml()+capHtml()+(delAsk?confirmHtml(c):"")+renovHtml(c,k)+histHtml(c);
 h+='<div class="card"><div class="grid">'+
 f("nombre","Nombre","text",c.nombre)+f("dpi","DPI (CUI, 13 dígitos)","text",c.dpi)+f("lugar","Lugar","text",c.lugar)+f("tel","Teléfono","tel",c.tel)+
 f("cantidad","Cantidad otorgada (Q)","number",c.cantidad)+f("cuota","Cuota diaria (Q)","number",c.cuota)+f("inicio","Fecha de inicio","date",c.inicio)+
 '</div>'+(tp(c)==="s"?"":'<p class="noprint" style="margin:10px 0 0"><label style="display:inline"><input type="checkbox" id="dom"'+(c.dom?" checked":"")+'> No cobrar los domingos</label></p>')+'<p class="noprint" style="margin:6px 0 0;color:var(--mut);font-size:13px">'+(tp(c)==="s"?"La cuota se calcula sola: Q140 semanales por cada Q500 (Q500 = Q140, Q1,000 = Q280, Q1,500 = Q420). Puede cambiarla a mano.":"La cuota se calcula sola: Q30 diarios por cada Q500 (Q500 = Q30, Q1,000 = Q60, Q1,500 = Q90). Puede cambiarla a mano.")+'</p></div>';
 h+=fotosHtml(c);h+='<div class="card sum"><div><span>Total a pagar ('+nd(c)+' cuotas)</span><b>'+q(k.total)+'</b></div><div><span>Abonado ('+k.n+' de '+nd(c)+')</span><b>'+q(k.ab)+'</b></div><div class="saldo"><span>Saldo</span><b>'+q(k.saldo)+'</b></div><div class="mora"><span>Mora pendiente</span><b>'+q(k.moraPend)+'</b></div></div>';
 h+='<div class="card cob noprint"><label>Nombre del cobrador (se anota como firma al cobrar)</label><input id="cobr" value="'+esc(cobrador)+'"></div>';
 h+='<div class="card"><div class="tw"><table><thead><tr><th>'+(tp(c)==="s"?"Sem.":"Día")+'</th><th>Fecha programada</th><th>Fecha de abono</th><th>Hora</th><th>Cuota</th><th>Firma cobrador</th><th>Mora</th><th class="noprint"></th></tr></thead><tbody>';
 c.rows.forEach(function(r,i){var s=k.st[i];
  h+='<tr class="'+(s.paid?"paid":s.late?"late":"")+'"><td class="d">'+(i+1)+'</td><td>'+fmt(s.due)+'</td>'+
  '<td><input type="date" data-i="'+i+'" data-k="f" value="'+esc(r.f)+'" aria-label="Fecha de abono día '+(i+1)+'"></td>'+
  '<td><input type="time" data-i="'+i+'" data-k="h" value="'+esc(r.h)+'" aria-label="Hora de abono día '+(i+1)+'"></td>'+
  '<td><input type="number" step="0.01" min="0" data-i="'+i+'" data-k="m" value="'+esc(r.m)+'" aria-label="Cuota día '+(i+1)+'"></td>'+
  '<td><input data-i="'+i+'" data-k="firma" value="'+esc(r.firma)+'" aria-label="Firma día '+(i+1)+'"></td>'+
  '<td class="mora-c'+(s.late?" on":"")+'">'+(s.late?q(MORA)+' <label style="display:inline;font-size:12px"><input type="checkbox" data-i="'+i+'" data-k="mp"'+(r.mp?" checked":"")+'> pagada</label>':"—")+'</td>'+
  '<td class="noprint">'+(s.paid?'<span class="pill">Pagado</span>':'<button data-cobrar="'+i+'">Cobrar</button>')+'</td></tr>'});
 h+='</tbody></table></div>'+
 '<p class="nota">NOTA: A partir del tercer día de atraso se cobran Q5.00 de mora por cada pago retrasado.</p></div>';
 h+='<p class="noprint"><button class="sec" data-est="1">Ver estado de cuenta</button> <button class="del" data-del="1">Eliminar este cliente</button></p>';
 h+=saveHtml(c);h+=navHtml();
 app.innerHTML=h;loadPhotos(c)}
var FOT=[["dpiF","Foto DPI lado frontal"],["dpiT","Foto DPI lado atrás"],["foto","Foto del cliente"]];
function idb(){return new Promise(function(res,rej){if(pdb)return res(pdb);try{var r=indexedDB.open("tucredito_fotos",1);r.onupgradeneeded=function(){r.result.createObjectStore("f")};r.onsuccess=function(){pdb=r.result;res(pdb)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function putPh(k,b){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction("f","readwrite");t.objectStore("f").put(b,k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function getPh(k){return idb().then(function(d){return new Promise(function(res,rej){var r=d.transaction("f","readonly").objectStore("f").get(k);r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})})}
function delPh(k){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction("f","readwrite");t.objectStore("f").delete(k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function fotosHtml(c){var f=c.fotos||{};return '<div class="card noprint"><b>Documentos y foto del cliente</b><div class="fotos">'+FOT.map(function(p){return '<div class="ph"><img id="ph-'+p[0]+'" alt="'+p[1]+'" hidden><button class="'+(f[p[0]]?'sec':'')+'" data-cam="'+p[0]+'"> '+p[1]+(f[p[0]]?' ':'')+'</button></div>'}).join("")+'</div></div>'}
function loadPhotos(c){FOT.forEach(function(p){var s=p[0];if(!(c.fotos&&c.fotos[s]))return;getPh(c.id+":"+s).then(function(b){if(b){var im=document.getElementById("ph-"+s);if(im){im.onload=function(){URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(b);im.hidden=false}}}).catch(function(){})})}
function pickPhoto(slot){var i=document.createElement("input");i.type="file";i.accept="image/*";i.capture=slot==="foto"?"user":"environment";i.onchange=function(){if(i.files&&i.files[0])procPhoto(slot,i.files[0])};i.click()}
function procPhoto(slot,file){var c=get();if(!c)return;
 var im=new Image(),u=URL.createObjectURL(file);
 im.onload=function(){var s=Math.min(1,(slot==="foto"?1000:1600)/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
  cv.toBlob(function(b){if(!b){toast("No se pudo procesar la foto.");return}
   putPh(c.id+":"+slot,b).then(function(){c.fotos=c.fotos||{};c.fotos[slot]=true;save();render();toast("Foto guardada en el crédito de "+(c.nombre||"el cliente"));if(slot!=="foto")leerDPI(b,slot,c.id)}).catch(function(){toast("No se pudo guardar la foto en este navegador.")})},"image/jpeg",slot==="foto"?.7:.85)};
 im.onerror=function(){toast("No se pudo abrir la foto.")};im.src=u}
function tit(t){return String(t||"").toLowerCase().replace(/\s+/g," ").trim().replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase()})}
async function leerDPI(blob,slot,cid){
 try{
  var sm=window.claude?await window.claude.use("sample"):null;
  if(!sm){toast("Lectura automática no disponible: escriba el nombre y el DPI.");return}
  var lim=await sm.limits();
  if(!lim||!lim.images){toast("Lectura automática no disponible: escriba el nombre y el DPI.");return}
  toast("Leyendo el DPI…");

 if(t.dataset.next||t.dataset.prev){var L=lst(),ix=L.findIndex(function(x){return x.id===cur}),n2=L.length;if(n2){ix=(ix+(t.dataset.next?1:n2-1))%n2;cur=L[ix].id;delAsk=false;render();window.scrollTo(0,0)}return}
 if(t.dataset.go){cur=t.dataset.go;est=false;home=false;delAsk=false;render();window.scrollTo(0,0);return}
 if(t.dataset.renovar&&c){var kk=calc(c),nc=+c.renov>0?+c.renov:+c.cantidad;
  if(!(nc>0)){toast("Escriba el monto del nuevo crédito.");return}
  if(nc<kk.saldo){toast("El nuevo crédito debe cubrir el saldo pendiente.");return}
  var nw=blank(tp(c));c.hist=c.hist||[];c.hist.push({ini:c.inicio,fin:iso(new Date()),cant:+c.cantidad||0,cuota:+c.cuota||0,ef:(c.efectivo!=null?+c.efectivo:+c.cantidad)||0,ab:kk.ab,mora:kk.moraPend,rows:c.rows});
  c.rows=nw.rows;c.inicio=nw.inicio;c.cantidad=nc;c.cuota=cuotaDe(nc,c);c.efectivo=nc-kk.saldo;c.renov="";c.cerrado=false;
  
  save();render();window.scrollTo(0,0);
  toast("Crédito renovado desde hoy. Entregue "+q(c.efectivo)+". Cuota diaria: "+q(c.cuota)+".");return}
 if(t.dataset.back){est=false;render();return}
 if(t.dataset.dl&&c){dl(c);return}
 if(t.dataset.print){try{window.print()}catch(x){toast("No se pudo abrir la impresión. Use «Descargar PDF».")}return}
 if(t.dataset.copy&&c){var tx=estText(c,calc(c)),ok=false;
  try{navigator.clipboard.writeText(tx).then(function(){toast("Estado de cuenta copiado")},function(){fb()});ok=true}catch(x){}
  function fb(){var a=document.createElement("textarea");a.value=tx;document.body.appendChild(a);a.select();var r=false;try{r=document.execCommand("copy")}catch(x){}document.body.removeChild(a);toast(r?"Estado de cuenta copiado":"No se pudo copiar. Use Imprimir.")}
  if(!ok)fb();return}
 if(t.dataset.del&&c){est=false;home=false;delAsk=true;render();window.scrollTo(0,0);return}
 if(t.dataset.delno){delAsk=false;render();return}
 if(t.dataset.delyes&&c){["dpiF","dpiT","foto"].forEach(function(s){delPh(c.id+":"+s).catch(function(){})});clients=clients.filter(function(x){return x!==c});cur=lst().length?lst()[0].id:null;delAsk=false;home=true;save();render();toast("Cliente eliminado");return}
 if(t.dataset.cobrar!==undefined&&c){
  if(!(+c.cuota>0)){toast("Escriba primero la cuota diaria.");return}
  var r=c.rows[+t.dataset.cobrar];r.f=iso(new Date());r.h=ahora();r.m=c.cuota;r.firma=cobrador||r.firma;save();render()}});
render();
